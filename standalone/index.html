<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFBC0D">
<meta name="description" content="更懂你的麦麦选餐助手：八个问题，把人数、预算、已有吃喝、口味和想不想尝新，凑成一餐能解释、能自己改的饭。">
<title>麦麦 · 更懂你的选餐助手（单文件版）</title>
<style>
:root{
 --yellow:#FFBC0D; --yellow-deep:#F5A300; --cream:#FFF8E7; --ink:#1A1A1A; --muted:#6B6B6B;
 --red:#E23B2E; --line:#E8E2D4; --card:#FFFFFF; --shadow:0 2px 12px rgba(26,26,26,.08);
 --r:16px; --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 background:var(--cream); color:var(--ink); line-height:1.55;
 -webkit-text-size-adjust:100%;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid var(--ink); outline-offset:2px; border-radius:8px;
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0}
main{min-height:100vh}

/* ===== 顶栏与进度 ===== */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--yellow);position:sticky;top:0;z-index:20}
.brand{font-weight:900;font-size:17px;letter-spacing:.02em}
.spacer{flex:1}
.ghost-btn{min-height:var(--tap);padding:0 12px;border-radius:999px;background:rgba(255,255,255,.7);font-weight:700;font-size:14px}
.icon-btn{min-width:var(--tap);min-height:var(--tap);border-radius:12px;background:rgba(255,255,255,.65);font-weight:800;font-size:18px;display:grid;place-items:center}

.progress{padding:8px 16px 12px;background:var(--yellow)}
.progress-text{font-size:13px;font-weight:800;margin-bottom:6px}
.progress-bar{display:flex;gap:4px}
.seg{flex:1;height:5px;border-radius:3px;background:rgba(26,26,26,.16);transition:transform .18s ease,background .18s ease}
.seg.done{background:var(--ink)}
.seg.now{background:var(--ink);transform:scaleY(2);transform-origin:center}

/* ===== 八步页 ===== */
.step-page{display:flex;flex-direction:column;min-height:100vh;background:var(--cream)}
.step-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.step-title{font-size:24px;line-height:1.3}
.step-hint{color:var(--muted);font-size:14px;margin-top:2px}
.step-sub{color:var(--muted);font-size:14px}
.section-title{font-size:15px;margin-top:4px}
.muted{color:var(--muted)}
.fine-note{font-size:12px;color:var(--muted);line-height:1.5}
.price-note{font-size:12px;color:var(--muted)}
.notice{background:#FFF;border-radius:12px;padding:12px;font-size:14px;border-left:4px solid var(--yellow-deep)}
.notice.neutral{border-left-color:#BBB}
.conflict{background:#FFF1EF;border-left:4px solid var(--red);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:6px}
.reason-line{font-size:13px;color:var(--muted);margin-top:6px}

/* ===== 场景图：每页不同构图 ===== */
.scene{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);flex:0 0 auto}
.scene-img{width:100%;height:30vh;max-height:220px;min-height:130px;object-fit:cover}
.scene-1 .scene-img{object-position:center 60%}
.scene-2 .scene-img{object-position:center 40%}
.scene-3 .scene-img{object-position:center 55%}
.scene-4 .scene-img{object-position:center 45%}
.scene-5 .scene-img{object-position:left center}
.scene-6 .scene-img{object-position:right center}
.scene-7 .scene-img{object-position:center 50%}
.scene-8 .scene-img{object-position:center 35%}

/* 1 餐位入位 */
.seats{position:absolute;inset:auto 0 8px 0;display:flex;gap:6px;justify-content:center;align-items:center;padding:0 10px}
.seat{width:20px;height:20px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);
 animation:seatIn .2s ease both;animation-delay:calc(var(--i)*.06s)}
.seat-more{font-size:12px;font-weight:800;background:rgba(255,255,255,.92);padding:3px 8px;border-radius:999px}
@keyframes seatIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 2 标尺停位 */
.ruler{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55));padding:8px 14px 10px;color:#fff}
.ruler-label{font-weight:900;font-size:18px}
.ruler-bar{display:block;height:4px;background:rgba(255,255,255,.35);border-radius:2px;margin-top:4px;position:relative}
.ruler-bar::after{content:"";position:absolute;left:min(100%,calc(var(--p)*1%));top:-4px;width:3px;height:12px;background:#fff;border-radius:2px}

/* 3 上下两层餐托 */
.trays{position:absolute;inset:auto 0 0 0;display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.tray{display:flex;gap:6px;align-items:center;font-size:11px;color:#fff;font-weight:700}
.tray-chip{background:rgba(255,255,255,.9);color:var(--ink);padding:2px 7px;border-radius:999px}
.tray-chip.zero{opacity:.45}

/* 4 质感拼贴 */
.texture{position:absolute;inset:auto 0 0 0;display:flex;gap:6px;padding:8px 10px;align-items:flex-end}
.tex{background:rgba(255,255,255,.88);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;
 transition:transform .2s ease,outline-color .2s ease;outline:2px solid transparent}
.tex-crispy{font-size:15px;padding:9px 13px}
.tex-mild{background:rgba(255,120,60,.9);color:#fff}
.tex-light{background:rgba(140,210,255,.92)}
.tex.on{transform:scale(1.1);outline-color:var(--ink)}

/* 5 两方向错位轻抬 */
.dirs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none}
.dir{background:rgba(255,255,255,.94);border-radius:12px;padding:8px 12px;text-align:center;box-shadow:var(--shadow);
 transition:transform .2s ease,opacity .2s ease}
.dir-0{transform:translateY(-6px) rotate(-1.5deg)}
.dir-1{transform:translateY(6px) rotate(1.5deg)}
.dir-name{display:block;font-weight:900}
.dir-sub{display:block;font-size:11px;color:var(--muted)}

/* 6 稳定底座 + 一个变化槽 */
.swap{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px}
.swap-base{background:rgba(255,255,255,.92);border-radius:12px;padding:10px 16px;font-weight:800;font-size:13px}
.swap-slot{background:var(--yellow);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:900;font-size:13px;min-width:64px;text-align:center}
.swap-slot.flip{animation:flip .22s ease}
@keyframes flip{from{transform:rotateY(0)}50%{transform:rotateY(90deg)}to{transform:rotateY(0)}}

/* 7 时间带 */
.timeline{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));align-items:center}
.tl-seg{flex:1 1 0;min-width:0;text-align:center;font-size:11px;font-weight:800;padding:6px 1px;border-radius:8px;
 background:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-seg.current{background:var(--ink);color:#fff}
.tl-seg.pending{background:repeating-linear-gradient(45deg,rgba(255,255,255,.5),rgba(255,255,255,.5) 4px,transparent 4px,transparent 8px);
 border:1px dashed rgba(255,255,255,.9);color:#fff}

/* 8 小票 + 记忆口袋 */
.receipt{position:absolute;inset:auto 0 0 0;display:flex;gap:8px;padding:10px;align-items:flex-end}
.slip{background:#fff;border-radius:6px;padding:8px 10px;font-size:11px;font-weight:700;box-shadow:var(--shadow);flex:1}
.slip-item{display:block}
.pocket{background:rgba(0,0,0,.5);color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;text-align:center}
.pocket-state{display:block;font-weight:900}

/* ===== 选项控件：触区≥44 ===== */
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.people-tile,.taste-tile,.novelty-tile,.plan-tile,.amount-tile,.unit-tile,.dir-tile{
 min-height:64px;border-radius:14px;background:var(--card);border:2px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;
 transition:transform .18s ease,border-color .18s ease;font-weight:700;
}
.people-tile strong,.taste-tile,.novelty-tile strong,.plan-tile strong,.dir-tile strong{font-size:17px;font-weight:900}
.people-tile small,.novelty-tile small,.plan-tile small,.dir-tile small{font-size:11px;color:var(--muted);font-weight:600}
.taste-tile{font-size:15px;font-weight:800}
.amount-tile{font-size:15px;font-weight:800}
.people-tile[aria-pressed=true],.taste-tile[aria-pressed=true],.novelty-tile[aria-pressed=true],
.plan-tile[aria-pressed=true],.amount-tile[aria-pressed=true],.unit-tile[aria-pressed=true],.dir-tile[aria-pressed=true]{
 border-color:var(--ink);background:var(--yellow);transform:translateY(-3px)}
.unit-tile{min-height:var(--tap);padding:0 14px;font-weight:700;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.dir-tile{min-height:84px;flex-direction:column}
.dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.more-people{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .icon-btn{background:var(--cream);min-width:var(--tap);min-height:var(--tap)}
.stepper-val{min-width:38px;text-align:center;font-weight:900;font-size:17px}
.unit-hint{font-size:12px;color:var(--muted)}

.ext-rows{display:flex;flex-direction:column;gap:8px}
.count-field{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.count-field>span:first-child{flex:1}

.cta{width:100%;min-height:52px;border-radius:14px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:17px;
 display:grid;place-items:center;transition:transform .18s ease}
.cta:active{transform:scale(.98)}
.secondary-action{width:100%;min-height:var(--tap);border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:15px}
.text-btn{min-height:var(--tap);padding:0 10px;font-weight:700;color:var(--muted);text-decoration:underline}
.decide-btn{width:100%;min-height:var(--tap);border-radius:14px;background:transparent;border:2px dashed var(--muted);
 font-weight:700;font-size:14px;color:var(--muted)}
.decide-btn[aria-pressed=true]{border-style:solid;border-color:var(--ink);color:var(--ink)}

.chip{min-height:var(--tap);padding:0 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:14px}
.chip[aria-pressed=true],.chip.selected{border-color:var(--ink);background:var(--yellow)}
.tools-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}

.familiar-list{display:flex;gap:8px;flex-wrap:wrap}
.consent-row{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;background:var(--card);
 border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.consent-row[aria-pressed=true]{border-color:var(--ink);background:#FFF6D6}
.consent-mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.consent-text{display:flex;flex-direction:column}
.consent-text strong{font-size:15px}
.consent-text small{font-size:12px;color:var(--muted)}
.saved-list{display:flex;flex-direction:column;gap:6px}
.saved-item{background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px}

/* ===== 首页 ===== */
.home{padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px;min-height:100vh;justify-content:center}
.home-intro h1{font-size:30px;line-height:1.2}
.home-intro .muted{margin-top:4px}
.hero-art{width:100%;height:24vh;max-height:180px;object-fit:cover;border-radius:var(--r);box-shadow:var(--shadow)}
.entry{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r);text-align:left;min-height:76px;
 transition:transform .18s ease}
.entry.primary{background:var(--yellow);box-shadow:var(--shadow)}
.entry.secondary{background:var(--card);border:2px solid var(--line);min-height:62px;padding:12px 16px}
.entry:active{transform:scale(.99)}
.entry-icon{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.entry .label{display:block;font-size:19px;font-weight:900}
.entry.secondary .label{font-size:16px}
.entry small{display:block;font-size:12px;opacity:.8}
.entry .arrow{margin-left:auto;font-size:24px;font-weight:900}
.home-note{font-size:13px;color:var(--muted);text-align:center}
.resume-note{font-size:13px;color:var(--muted);text-align:center}
.home-footer{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.conn-line{background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700}

/* ===== 经典选餐 ===== */
.menu-layout{display:grid;grid-template-columns:1fr;gap:10px;padding:0 16px}
.categories{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.category{min-height:var(--tap);padding:0 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);
 font-weight:700;font-size:13px;white-space:nowrap;flex:0 0 auto}
.category.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.menu-products{display:flex;flex-direction:column;gap:8px}
/* ===== 轮换计划的其余几顿 ===== */
.plan-section{background:var(--card);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.plan-meals{display:flex;flex-direction:column;gap:6px}
.plan-meal{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.plan-meal:last-child{border-bottom:0}
.plan-toggle{width:100%;min-height:var(--tap);display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:8px 2px;font-size:14px;font-weight:800;text-align:left}
.plan-toggle::after{content:'＋';font-weight:900;color:var(--muted);font-size:15px}
.plan-toggle.open::after{content:'－'}
.plan-toggle[aria-expanded=true]{border-bottom:1px dashed var(--line);margin-bottom:6px}
.plan-detail{min-width:0;padding:0 2px 8px}
.plan-names{font-size:14px;font-weight:700;margin-bottom:2px}

/* 经典选餐卡片 */
.menu-item{display:grid;grid-template-columns:56px 1fr;gap:4px 10px;align-items:center;background:var(--card);
 border-radius:14px;padding:10px}
.menu-item-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.menu-item h3{font-size:15px}
.menu-item p{font-size:12px;color:var(--muted);line-height:1.45}
.menu-item-bottom{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--cream)}
.add{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--yellow);font-size:22px;font-weight:900;display:grid;place-items:center}

/* ===== 餐单与结果 ===== */
.flow{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.page-intro h2{font-size:24px}
.title-row h2{font-size:22px}
.cart-list{display:flex;flex-direction:column;gap:8px}
.cart-row{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cart-top{display:flex;gap:10px;align-items:center}
.food-info{flex:1;min-width:0}
.cart-controls{display:flex;align-items:center;justify-content:space-between}
.price{font-weight:900;font-size:17px}
.total-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:12px}

.meal-card{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.section-kicker{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.food-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.food-row:last-of-type{border-bottom:0}
.food-row.suggested{background:#FFFBEC;border-radius:10px;padding:8px}
.rec-footer{display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--line);padding-top:10px;margin-top:6px}
.row-price{display:flex;flex-direction:column;align-items:flex-end;line-height:1.35}
.unit-price{font-size:11px;color:var(--muted)}
.row-sub{font-weight:900;font-size:15px}
.budget-status{font-size:12px;font-weight:800;background:var(--cream);padding:4px 8px;border-radius:999px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 16px;text-align:center}

.bottom-bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 14px;
 padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--yellow);z-index:30}
.bag-count{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.bag-info{flex:1}
.bag-info span{display:block;font-weight:900;font-size:14px}
.bag-info small{font-size:11px}
.bottom-bar .cta{width:auto;min-height:var(--tap);padding:0 18px;font-size:15px}

/* ===== 弹层 ===== */
.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:40}
.sheet{background:var(--cream);width:100%;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.handle{width:38px;height:4px;border-radius:2px;background:#CCC;margin:0 auto 8px}
.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-header h2{font-size:19px}
.drawer-choice{width:100%;min-height:var(--tap);background:var(--card);border-radius:12px;padding:12px;font-weight:700;text-align:left;margin-bottom:6px}
.spec-product{font-size:14px;margin-top:10px}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
 padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== 桌面适配 ===== */
@media (min-width:720px){
 .step-page{max-width:720px;margin:0 auto;background:var(--cream)}
 .scene-img{height:34vh;max-height:280px}
 .home{max-width:560px;margin:0 auto}
 .flow,.menu-layout{max-width:720px;margin:0 auto}
 .choice-grid{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1024px){
 .step-page{max-width:820px}
 .dir-grid{gap:16px}
}

/* ===== 大字/缩放：内容可滚动，底栏不遮挡 ===== */
@media (max-width:359px){
 .step-title{font-size:21px}
 .people-tile strong,.taste-tile{font-size:15px}
 .scene-img{height:24vh;min-height:110px}
}
/* ===== 减少动态效果 ===== */
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;scroll-behavior:auto!important}
 .seat{opacity:1;transform:none}
 .swap-slot.flip{animation:none}
 .people-tile[aria-pressed=true],.taste-tile[aria-pressed=true],.novelty-tile[aria-pressed=true],
 .plan-tile[aria-pressed=true],.amount-tile[aria-pressed=true],.unit-tile[aria-pressed=true],.dir-tile[aria-pressed=true]{
  transform:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

(function(root){
'use strict';
/* C4 经同意的记忆存储。
   四类同意彼此独立：useSavedTaste / useSavedSelections / saveExplicitTaste / saveFinalSelection / saveRotationPlan。
   每条偏好都带来源(subjectId / dimension / value / source / consentId)，归属不明的多人共用答案不写入本人。
   存储失败必须如实返回失败，不允许显示成功。本地存储不暗示云同步。 */
const SCHEMA=2,KEY='maimai.memory.v2',LEGACY_KEY='maimai.preferences.v1';

function emptyStore(){return {schema:SCHEMA,consent:null,tastes:[],selections:[],rotations:[],feedback:[],migratedFrom:null};}

/* 旧结构（单值 taste / recent 名称串）只能按已有证据迁移：旧 recent 不证明吃过，不迁移为熟悉款。 */
function migrateLegacy(raw){
 const store=emptyStore();if(!raw)return store;
 try{
  const old=JSON.parse(raw);
  if(!old||old.enabled!==true)return store;
  store.migratedFrom=LEGACY_KEY;
  for(const item of old.items||[]){
   if(item?.id==='taste'&&typeof item.value==='string'){

/* 覆盖计算：先占餐单与锁定的人员槽位，再把外部已有分到剩余槽位，最后只补缺口。 */
function buildCoverage(state,catalog){
 const n=state.constraints.people,ids=personIds(n);
 const cov={main:0,side:0,drink:0};
 const occupiedMain=new Set(),occupiedDrink=new Set();
 const units=[];
 const lines=[...(state.cart||[])];
 /* 餐单与锁定是固定项 */
 for(const lock of state.locks||[])lines.push(lock);
 for(const line of lines){
  const p=catalog.find(x=>x.id===line.productId);if(!p)continue;
  const c=coverageOf(p),qty=line.quantity||1;
  const lineIds=line.assignedTo||[];
  for(let i=0;i<qty;i++){
   const size=c.main||c.drink||0;
   let mine=lineIds.length?lineIds.slice(i*size,(i+1)*size):[];
   if(!mine.length&&(c.main||c.drink)){
    const occ=c.main?occupiedMain:occupiedDrink;
    mine=ids.filter(id=>!occ.has(id)).slice(0,c.main||c.drink);
   }
   if(p.role==='side'||(c.main||0)>1)mine=ids;
   const u=D.makeUnit(p,mine,line.specs||{},line.lockId||null);
   u.origin='fixed';                     /* 来自餐单或锁定的固定单位 */
   if(!allowed(p,mine.length?mine:ids,state))return {error:'已选餐单或保留项与明确忌口冲突，或成分信息待核实；请自行调整餐单或条件。'};
   if(c.main)mine.slice(0,c.main).forEach(id=>occupiedMain.add(id));
   if(c.drink)mine.slice(0,c.drink).forEach(id=>occupiedDrink.add(id));
   for(const r of ROLES)cov[r]+=c[r]||0;
   units.push(u);
  }
 }
 /* 外部已有：咖啡与其他饮品合计只抵扣一次饮品需求，绝不按一个布尔值删掉整组饮品 */
 const ext=state.external||W.emptyExternal();
 const remainingMain=ids.filter(id=>!occupiedMain.has(id));
 const drinkNeed=Math.max(0,(targets(n,state.constraints.portion).drink)-cov.drink);
 const drinkExternal=Math.min(W.externalDrinkCount(ext),drinkNeed);
 /* 主食外部已有按实际份数抵扣剩余槽位 */
 const externalApplied={main:Math.min(ext.main||0,remainingMain.length),side:ext.side||0,drink:drinkExternal};
 for(let i=0;i<externalApplied.main;i++)cov.main++;
 cov.side+=externalApplied.side;
 cov.drink+=externalApplied.drink;
 return {cov,units,ids,occupiedMain,occupiedDrink,externalApplied};
}

/* 单份缺口补齐：为每个未覆盖人员槽位找一件商品 */
function fillGap(state,catalog,base,options){
 const opts=options||{};
 const t=targets(state.constraints.people,state.constraints.portion);
 const units=base.units.map(u=>({...u,used:false}));
 const out=units.filter(u=>u.used===false);
 const cov={...base.cov};
 const penalize=new Set(opts.penalize||[]);
 const taste=opts.taste||null;
 const need=(role)=>Math.max(0,(t[role]||0)-cov[role]);
 const products=catalog.filter(p=>p.recommendable!==false);

 /* 确定性排序分：分数越高越优先。只有有证据且符合的维度才加分。
    assignees 是实际食用者。个人例外优先于全组口味：那个人自己选的口味是他那份的主依据，
    全组口味只是默认倾向，不能压过个人明确选择。 */
 function rank(product,assignees){
  let score=-(product.rank||0);
  if(penalize.has(product.id))score-=50;
  if(!directionOk(product,state))score-=1000;
  if(!allowed(product,assignees&&assignees.length?assignees:base.ids,state))score-=1000;
  const who=assignees&&assignees.length?assignees:base.ids;
  const personal=who.filter(id=>state.constraints.personPrefs?.[id]?.taste);
  if(personal.length){
   /* 有个人明确口味时，用他自己的口味评分；全组口味只作次要参考 */
   for(const id of personal)score+=W.tasteScore(product,W.buildTaste([state.constraints.personPrefs[id].taste],'person'))*6;
   score+=W.tasteScore(product,taste);
  }else score+=W.tasteScore(product,taste)*3;
  return score;
 }
 /* 主食按人逐个挑选：先为每个未覆盖的人排出他的最优，再依次落位，
    这样第 2 位“不油腻”的偏好能真正影响他/她那份，而不是被第 1 位偏好带偏。 */
 function pickFor(personId,role,filterFn){
  const pool=products.filter(filterFn);
  const ranked=pool.map(p=>({p,score:rank(p,[personId])}))
   .sort((a,b)=>b.score-a.score||a.p.id.localeCompare(b.p.id));
  return ranked.length?ranked[0].p:null;
 }
 for(const role of ['main','side','drink']){
  let guard=0;
  while(need(role)>0&&guard++<40){
   /* 补单一槽位时优先用刚好覆盖该角色的单品；组合装只在没有可行单品时才考虑，
      并且绝不允许把其他角色补超——避免用一份组合装把三个槽位一起灌满。 */
   const overshoots=p=>ROLES.some(r=>r!==role&&(coverageOf(p)[r]||0)>0&&cov[r]+(coverageOf(p)[r]||0)>t[r]);
   const exact=p=>ROLES.every(r=>r===role||!coverageOf(p)[r]);
   const pool=products.filter(p=>{const c=coverageOf(p);if(!(c[role]>0))return false;
     if(cov[role]+(c[role]||0)>t[role])return false;      /* 本角色不补超 */
     if(!directionOk(p,state)||!allowed(p,base.ids,state))return false;
     return true;})
    .sort((a,b)=>rank(b)-rank(a)||a.id.localeCompare(b.id));
   const exactPool=pool.filter(exact);
   const usable=exactPool.length?exactPool:pool.filter(p=>!overshoots(p));
   const chosen=usable[0]||pool.filter(exact)[0];
   if(!chosen)break;
   const p=chosen,c=coverageOf(p);
   if(role==='drink'){
    const occ=new Set([...base.occupiedDrink,...out.filter(u=>coverageOf(u).drink).flatMap(u=>u.assignedTo)]);
    const mine=[base.ids.find(id=>!occ.has(id))||base.ids[0]];
    out.push(D.makeUnit(p,mine,{}));out[out.length-1].origin='suggested';if(c.drink)mine.forEach(id=>base.occupiedDrink.add(id));
   }else if(role==='main'){
    /* 主食按人逐个挑选：谁还没吃到，就按那个人的偏好挑一份。
       这样第 2 位“不油腻”的例外能真正影响他/她那份。 */
    const free=base.ids.filter(id=>!base.occupiedMain.has(id));
    if(!free.length)break;
    const person=free[0];
    const p=pickFor(person,role,p=>{const c=coverageOf(p);
      if(!(c.main>0))return false;
      if(cov.main+(c.main||0)>t.main)return false;
      if(!directionOk(p,state))return false;
      if(!allowed(p,[person],state)&&!allowed(p,[...free],state))return false;
      return true;})||usable[0];
    const pc=coverageOf(p);
    const take=free.slice(0,pc.main||1);
    out.push(D.makeUnit(p,take,{}));out[out.length-1].origin='suggested';
    take.forEach(id=>base.occupiedMain.add(id));
    for(const r of ROLES)cov[r]+=pc[r]||0;
    continue;
   }else out.push(D.makeUnit(p,base.ids,{}));
   for(const r of ROLES)cov[r]+=c[r]||0;
   out[out.length-1].origin='suggested';   /* 本次补缺口的单位 */
  }
 }
 return {units:out,cov};
}

/* 生成整餐。options.direction / taste / novelty / penalize 全部来自八题答案。 */
function buildMeal(state,catalog,options){
 const opts=options||{};
 let s=clone(state);
 /* 方向必须在评分前写入状态，否则方向不会真正影响结果 */
 if(opts.direction)s.direction=opts.direction;
 if(opts.novelty)s.novelty=opts.novelty;
 if(opts.taste)s.sessionTaste=opts.taste;
 if(!Number.isInteger(s.constraints.people)||s.constraints.people<1||s.constraints.people>12)
  return failure('先选择精确人数（演示支持 1–12 人）。');
 const base=buildCoverage(s,catalog);
 if(base.error)return failure(base.error);
 const taste=opts.taste||null;
 const filled=fillGap(s,catalog,base,{taste:taste,penalize:opts.penalize});
 const t=targets(s.constraints.people,s.constraints.portion);
 if(filled.cov.main<t.main)
  return failure('主食份数少于当前人数；请调整已有数量、人数或解除部分保留。');
 const parts=D.group(filled.units);
 const sum=cost(parts,s,catalog);
 const limit=D.budgetLimit(s.constraints);
 /* 预算覆盖餐单＋建议新增＋已知必付费用。未知价格不能报告已满足预算。
    超预算时给出直接冲突，不静默减人数、删餐单或放宽忌口。 */
 if(limit!==null&&sum&&sum.minor>limit)
  return failure('当前餐单与建议新增合计 '+(sum.minor/100)+' 元，超过你设的 '+(limit/100)+' 元上限。请调整预算、取消部分保留，或减少人数——没有静默删减任何内容。');
 const reasons=buildReasons(s,filled,t,base,taste,opts);
 const rec={parts,units:filled.units,coverage:filled.cov,externalApplied:base.externalApplied,total:sum,
  /* 供尝新派生金额使用：餐单固定金额与已知费用必须一起带过去 */
  cartTotal:D.total(s.state?s.state.cart:s.cart,catalog),
  feeMinor:s.context&&s.context.feeMinor?s.context.feeMinor:0,
  budgetStatus:limit===null?'unset':sum?'within':'pending',
  budgetLimit:limit,targets:t,reasons,conflicts:[],
  signature:D.signature(filled.units),
  direction:s.direction||null,noveltyMode:opts.novelty?.mode||null};
 const novelty=W.applyNovelty(rec,catalog,opts.novelty,{taste,budgetLimit:limit,
  allowedFn:p=>allowed(p,base.ids,s)&&directionOk(p,s),
  /* 轮换时，尝新替换不得把这一顿换回上一顿已经吃过的主食，
     否则每一顿都会被拉回同一款，轮换就失去意义。 */
  penalize:opts.penalize,
  /* 费用必须原样传递：null 表示未知，绝不能被 ||0 变成"免费" */
  feeMinor:s.context?s.context.feeMinor:0});
 /* applyNovelty 已在 unit 层重算并派生 parts/total/coverage/signature/budgetStatus。
    这里只取它派生后的字段，绝不再单独覆盖 total，否则行项与合计会不一致。 */
 if(novelty.noveltyApplied)rec.noveltyApplied=novelty.noveltyApplied;
 if(novelty.parts)rec.parts=novelty.parts;
 if(novelty.units)rec.units=novelty.units;
 if(novelty.total!==undefined)rec.total=novelty.total;
 if(novelty.coverage)rec.coverage=novelty.coverage;
 if(novelty.signature)rec.signature=novelty.signature;
 if(novelty.budgetStatus)rec.budgetStatus=novelty.budgetStatus;
 if(novelty.unknownReason!==undefined)rec.unknownReason=novelty.unknownReason;
 /* 预算结论已由 deriveFromUnits 按最终金额判定，这里不得再算一次——
    旧代码在此处用 limit===null?'unset':... 覆盖，导致"金额未知"被写成"预算未设"。 */
 const {fixed,suggested}=splitParts(rec,s);
 if(!suggested.length)reasons.push('这顿已经搭好了，无需再添。');
 else reasons.push('份量按演示规则搭配，不代表营养或精准饱腹。');
 rec.fixedParts=fixed;rec.suggestedParts=suggested;
 return rec;
}
/* 无解时返回统一形状：必须带空的 fixedParts/suggestedParts，
   否则调用方读 suggestedParts.length 会抛异常，把"如实告知无解"变成页面崩溃。 */
function failure(message){return {parts:[],units:[],coverage:{main:0,side:0,drink:0},conflicts:[message],
 reasons:[],total:null,budgetStatus:'pending',budgetLimit:null,signature:'',
 fixedParts:[],suggestedParts:[],noveltyApplied:null,unknownReason:'预算或条件冲突'};}
/* parts 已经包含固定餐单与锁定单位（buildCoverage 会把它们展开进 units），
   所以这里只加已知必付费用，不能再把 state.cart 加一次，否则会重复计价。 */
function cost(parts,state,catalog){
 const base=D.total(parts,catalog);
 if(base===null)return null;
 if(state.context&&state.context.feeMinor===null)return null;
 return money(base.minor+((state.context&&state.context.feeMinor)||0));
}
/* 解释必须可追溯：有证据才说符合，未知就说资料不完整，不制造匹配百分比。 */
function buildReasons(state,filled,t,base,taste,opts){
 const bits=[];
 bits.push(filled.cov.main+' 份主食'+(filled.cov.side?'，'+filled.cov.side+' 份小食可共享':'')+'，'+filled.cov.drink+' 杯饮品。');
 if(base.externalApplied.main||base.externalApplied.drink||base.externalApplied.side){
  /* 只把餐单与外部已有的量算作"已覆盖"；本次建议新增不能算进去，否则文案会自相矛盾 */
  const fixedDrinks=base.units.filter(u=>coverageOf(u).drink>0).length;
  bits.push('已扣除外部已有 '+W.buildExternalMessage(filled.cov,t,{main:Math.max(0,t.main-filled.cov.main),side:Math.max(0,t.side-filled.cov.side),drink:Math.max(0,t.drink-filled.cov.drink)},state.external,fixedDrinks)+'；只补缺少的部分。');
 }
 if(taste&&taste.source){
  const first=filled.units[0];
  const named=first?tasteExplanationFor(first,taste):[];
  bits.push(named.length?named.join('；')+'（来源：'+taste.sourceLabel+'）。':'按'+W.describeTaste(taste)+'的方向挑选；这项商品没有可用标签依据。');
 }
 if(state.direction)bits.push('按你选的'+describeDirection(state.direction)+'方向补主食。');
 if(opts.noveltyMode==='safe')bits.push('按你说的稳妥一点，这次不主动换。');
 return bits;
}
function tasteExplanationFor(product,taste){return W.tasteExplanation(product,taste);}

/* 第 5 题用的方向描述：只说用户选的方向，不编造“你常吃”。 */
const DIRECTION_NAMES={burger:'汉堡',wrap:'卷',chicken:'鸡肉',fish:'鱼排',side:'小食',drink:'饮品'};
function describeDirection(d){if(!d)return'';return d.label||DIRECTION_NAMES[d.id]||d.id;}

/* 区分“已固定”与“建议新增”。
   parts 里同时含餐单/锁定固定单位和本次补的缺口单位；
   只有 suggested 能加入餐单，fixed 绝不能被重复批量加入（否则双击或后退会重复下单式操作）。 */
/* 固定与建议新增必须按 unit 来源分开聚合。
   旧实现用 parts（聚合行）去 units 里 find 第一个匹配：同一商品既在餐单又在建议里时，
   会把整行都判成"固定"，导致新增的那几份从建议里消失、显示成"已加入×2"但购物车只有1份。
   这里改为：先按 unit 的 origin 分组，再各自聚合。 */
function splitParts(rec,state){
 const units=rec.units||[];
 const fixedUnits=units.filter(u=>u.origin==='fixed');
 const sugUnits=units.filter(u=>u.origin!=='fixed');
 return {fixed:W.aggregateParts(fixedUnits),suggested:W.aggregateParts(sugUnits)};
}
let _catalog=[];
function catalog_find(id){return _catalog.find(p=>p.id===id);}
function setCatalog(c){_catalog=c;}

const api={targets,personIds,coverageOf,coverageKey,allowed,buildCoverage,fillGap,buildMeal,failure,cost,
 avoidSet,directionOk,describeDirection,splitParts,setCatalog};
if(typeof module!=='undefined')module.exports=api;else root.McEngine=api;
})(typeof window!=='undefined'?window:globalThis);

(function(root){
'use strict';
/* 八步引导视图层。每一页有专属场景构图与一次性轻动效，不是同一张卡片换文案。
   无框架、无构建步骤、无 CDN 依赖，可直接 file:// 打开。 */
const W=root.McWizard,E=root.McEngine,C=root.McDemo,D=root.McDomain;

function el(tag,cls,text,attrs){
 const n=document.createElement(tag);
 if(cls)n.className=cls;
 /* text 参数只接受字符串或 null。传进 DOM 节点或多个子元素说明调用方误用了 el()，
    那会把 "[object HTMLParagraphElement]" 印到界面上，或干脆渲染出空容器。
    这里直接抛错，让这类错误在测试中立刻暴露，而不是变成一张"看起来没事"的截图。 */
 if(text!==undefined&&text!==null){
  if(typeof text!=='string')throw new TypeError('el("'+tag+'") 的 text 参数必须是字符串或 null，收到 '+typeof text+'。子元素请用 append() 或 add()。');
  n.textContent=text;
 }
 if(attrs&&typeof attrs==='object'&&!attrs.nodeType){
  for(const [k,v] of Object.entries(attrs)){
   if(v===null||v===undefined)continue;
   /* setAttribute 支持 aria-* 这类带连字符的属性名；dataset 不支持。
      统一走 setAttribute，避免"aria-label 不是合法属性名"这类运行期报错。 */
   n.setAttribute(k,v);
  }
 }
 return n;
}
function add(parent,...kids){for(const k of kids)if(k)parent.append(k);return parent;}
/* 触区不小于 44×44 */
/* data 里可能混有 aria-* / role 这类带连字符或非 camelCase 的键，
   它们不能写进 dataset（会抛 "'aria-label' is not a valid property name"），
   必须走 setAttribute。只有合法的 data-* 键才写 dataset。 */
function btn(label,action,cls,data,attrs){
 const b=el('button',cls||'',label,Object.assign({'data-action':action,'data-touch':'44'},attrs||{}));
 if(data)for(const [k,v] of Object.entries(data)){
  if(v===undefined||v===null)continue;
  if(/^[A-Za-z][A-Za-z0-9]*$/.test(k))b.dataset[k]=v;
  else b.setAttribute(k,v);
 }
 return b;
}
function money(minor){return minor===null||minor===undefined?'待核实':'¥'+(minor/100).toFixed(minor%100===0?0:2);}

/* ---------- 场景插画：每页不同构图，全部用真实加载的图片素材 ---------- */
function scene(step,opts){
 const o=opts||{};
 const box=el('div','scene scene-'+step);
 const img=el('img','scene-img');
 img.src='assets/'+(o.art||SCENE_ART[step])+'.webp';
 img.alt=o.alt||SCENE_ALT[step];
 img.loading='eager';img.decoding='async';
 img.width=320;img.height=200;
 box.append(img);
 if(step===1)box.append(seats(o.count||1));
 if(step===2)box.append(ruler(o.amount));
 if(step===3)box.append(trays(o.external));
 if(step===4)box.append(texture(o.taste));
 if(step===5)box.append(directions(o.dirs));
 if(step===6)box.append(swapSlot(o.novelty));
 if(step===7)box.append(timeline(o.length));
 if(step===8)box.append(receipt(o.memory));
 return box;
}
/* 每页场景构图使用的图片素材，全部取自实际存在的 assets/*.webp。
   选图原则贴合题意：人数用大桌图、预算用整餐图、已有吃喝用饮品、
   口感用鸡腿堡近景、方向用两种主食并列、尝新用小食、轮换用组合、记忆用甜品。 */
const SCENE_ART={1:'hero',2:'wings',3:'coffee',4:'crispy',5:'burger',6:'fries',7:'nuggets',8:'pie'};
const SCENE_ALT={1:'摆好餐位的餐桌示意',2:'餐垫与预算票据示意',3:'上下两层餐托示意',4:'酥脆口感近景示意',
 5:'两个方向的食品对比示意',6:'稳定底座与一个变化槽示意',7:'多顿时间带示意',8:'食品标签小票示意'};

/* 1 餐位依次入位 */
function seats(count){
 const wrap=el('div','seats');
 const shown=Math.min(count,4);
 for(let i=0;i<shown;i++){const s=el('span','seat');s.style.setProperty('--i',i);wrap.append(s);}
 if(count>4)wrap.append(el('span','seat-more','× '+count+' 个餐位'));
 return wrap;
}
/* 2 标尺停位 */
function ruler(amount){
 const r=el('div','ruler');
 r.append(el('span','ruler-label',amount?money(amount):'不设上限'));
 const bar=el('span','ruler-bar');bar.style.setProperty('--p',amount?Math.min(100,amount/100):0);r.append(bar);
 return r;
}
/* 3 已有食物落托 */
function trays(external,opts){
 const e=external||{};
 const o=opts||{};
 const wrap=el('div','trays');
 const top=el('div','tray tray-cart'),bot=el('div','tray tray-ext');
 top.append(el('span','tray-title',o.cartCount?('餐单已选 '+o.cartCount+' 件'):'餐单还空着'));

/* 4 质感拼贴：三块大小不同但统一色调的感官局部 */
function texture(words){
 const t=words||[];
 const wrap=el('div','texture');
 for(const [key,label] of [['crispy','香脆'],['mild','微辣'],['light','清爽']]){

function result(s,rec){

 if(plan>1)main.append(el('p','muted','共 '+plan+' 顿。下面是第 1 顿，其余几顿在下方。'));

 if(rec.conflicts.length){

 }else{
  E.setCatalog(C.products);

   for(const p of fixed)card.append(rowOf(p,'fixed'));
  }
  const ext=s.state.external||W.emptyExternal();
  if(W.externalDrinkCount(ext)||ext.main||ext.side)

  card.append(el('p','section-kicker',suggested.length?'建议新增':'无需再添'));
  for(const p of suggested)card.append(rowOf(p,'suggested'));
  /* 合计区：单价×数量逐行可对账，合计必须等于各行小计之和 */
  const footer=el('div','rec-footer');
  const left=el('div');
  left.append(el('p','price-note','餐单＋建议新增 · 演示合计'),priceNode(rec.total));

  card.append(footer);
  for(const r of rec.reasons)card.append(el('p','reason-line',r));
  if(rec.noveltyApplied)card.append(el('p','reason-line','尝新：'+rec.noveltyApplied.note));
 }
 main.append(card);
 /* 多顿：突出第 1 顿，其余以缩略条展开查看（不得只在文案里承诺却不做） */
 const planObj=s.plan;
 if(planObj&&planObj.length>1&&planObj.meals.length>1)main.append(planSection(planObj,s));
 const addBtn=btn(suggestedCount(rec)?'加入餐单':'这顿已经搭好了','w-add','cta',{},{disabled:suggestedCount(rec)?null:'disabled'});
 main.append(addBtn);
 main.append(btn('看看有没有更合适的省钱搭配','w-savings','secondary-action'));

 if(s.state.cart.length)main.append(btn('查看餐单','cart','secondary-action'));
 main.append(el('p','fine-note','只加入本地餐单，不下单、不付款。图片、成分与价格均为虚构演示。'));
 return main;
}
/* 轮换计划的其余几顿：默认可折叠，点击展开逐顿明细 */
function planSection(plan,s){
 const box=el('section','plan-section');
 box.append(el('p','section-kicker','接下来 '+plan.length+' 顿'));
 if(plan.note)box.append(el('p','fine-note',plan.note));

 for(const meal of plan.meals){
  if(meal.index===1)continue;/* 第 1 顿已在上面完整展示 */
  const det=el('div','plan-detail');
  det.append(el('p','plan-names',meal.parts.length?meal.parts.map(p=>p.name+' ×'+p.quantity).join('、'):'无需再添'));
  det.append(el('p','fine-note','演示合计 '+(meal.total?money(meal.total.minor):'待核实')+'　·　'+

  const row=el('div','plan-meal');

   {'aria-expanded':'false','aria-label':'展开第 '+meal.index+' 顿明细'});
  det.hidden=true;
  row.append(head,det);

 if(plan.historyUsed&&plan.historyUsed.length)

function suggestedCount(rec){return (rec.suggestedParts||[]).length;}
/* 每一行都必须能自己算清：显示"单价 × 数量 = 小计"，
   否则页面上只看到一个单价，很容易被当成整行金额。 */
function rowOf(p,kind){
 const row=el('article','food-row '+kind);
 const c=E.coverageOf(p);
 const alloc=p.assignedTo&&p.assignedTo.length?('第 '+p.assignedTo.map(x=>x.slice(1)).join('、')+' 人'):(c.main>1?'共享':'');
 const qty=p.quantity||1;
 const unit=p.price&&p.price.minor!==null&&p.price.minor!==undefined?money(p.price.minor):null;
 const sub=unit===null?null:money(p.price.minor*qty);
 const priceWrap=el('div','row-price');

  s.wizard.inputCount++;s.wizard.revision++;render();return;}
 if(a==='w-familiar'){
  const cur=answerValue(5)||{mode:'swap',familiar:[]};
  const fam=cur.familiar.includes(v)?cur.familiar.filter(x=>x!==v):[...cur.familiar,v];
  s.wizard.answers[5]={status:'answered',value:{...cur,familiar:fam},source:'explicit',at:new Date().toISOString()};
  s.wizard.inputCount++;render();return;}
 if(a==='w-familiar-none'){
  const cur=answerValue(5)||{mode:'swap'};
  s.wizard.answers[5]={status:'answered',value:{...cur,familiar:[]},source:'explicit',at:new Date().toISOString()};
  s.wizard.inputCount++;render();return;}
 if(a==='w-novelty-confirm'){
  /* 确认按钮本身才算这一题已答：只选了模式但没确认时不算 */
  const cur=answerValue(5);
  s.wizard.answers[5]={status:'answered',value:cur&&cur.mode?cur:{mode:'balance',familiar:[]},source:'explicit',at:new Date().toISOString()};
  s.wizard.inputCount++;s.wizard.revision++;
  s.wizard.step=7;render();return;}
 /* 第 7 题 */
 if(a==='w-plan'){
  s.wizard.answers[6]={status:'answered',value:{length:Number(v)},source:'explicit',at:new Date().toISOString()};
  s.wizard.inputCount++;s.wizard.revision++;render();return;}
 if(a==='w-plan-confirm'){
  /* 没有明确选择顿数时，“帮我决定”的解释就是先只搭本顿 */
  const cur=answerValue(6);
  if(!cur||!cur.length)s.wizard.answers[6]={status:'answered',value:{length:1},source:'decided',at:new Date().toISOString()};
  s.wizard.step=8;render();return;}
 /* 第 8 题 */
 if(a==='w-consent'){
  const cur=answerValue(7)||{consent:W.emptyConsent()};
  const consent={...W.emptyConsent(),...cur.consent};
  consent[v]=!consent[v];
  s.wizard.answers[7]={status:'answered',value:{...cur,consent},source:'explicit',at:new Date().toISOString()};
  s.wizard.inputCount++;s.wizard.revision++;render();return;}
 if(a==='w-consent-none'){
  s.wizard.answers[7]={status:'answered',value:{consent:W.emptyConsent()},source:'explicit',at:new Date().toISOString()};
  s.wizard.inputCount++;s.wizard.revision++;render();return;}
 if(a==='w-submit'){submitWizard();return;}
 /* 帮我决定：只回答当前题 */
 if(a==='w-decide'){handleDecide(Number(b.dataset.index));return;}
 /* 结果页 */
 if(a==='w-edit-answers'){s.route='wizard';render();scrollTo(0,0);return;}
 if(a==='w-add'){addSuggestions();return;}
 if(a==='w-savings'){openSavings();return;}
 /* 轮换计划里某一顿的展开/收起 */
 if(a==='w-plan-meal'){
  const det=b.nextElementSibling;
  if(!det)return;
  const open=det.hidden;
  det.hidden=!open;
  b.setAttribute('aria-expanded',String(open));
  b.setAttribute('aria-label',(open?'收起':'展开')+'第 '+b.dataset.index+' 顿明细');
  b.classList.toggle('open',open);
  return;}
 if(a==='w-eaten'){s.eaten=true;s.feedbackOpen=true;render();notify('现在可以评价这顿了吗？');return;}
 if(a==='w-fb-good'){closeFeedback('合口味');return;}
 if(a==='w-fb-adjust'){s.feedbackOpen=false;s.dialog={type:'fb-item'};render();return;}
 if(a==='w-fb-skip'){closeFeedback(null);return;}
 if(a==='w-fb-item'){s.dialog={type:'fb-kind',unit:b.dataset.id};render();return;}
 if(a==='w-fb-kind'){recordFeedback(b.dataset.kind);return;}
 if(a==='close-dialog'){s.dialog=null;render();return;}
 /* 经典与餐单 */
 if(a==='w-category'){s.state.categoryId=b.dataset.id;render();return;}
 if(a==='w-add-product'){addProduct(b.dataset.id);return;}
 if(a==='w-qty'){changeQty(b.dataset.key,Number(v));return;}
 if(a==='w-edit-line'){editSpecs(b.dataset.key);return;}
 /* 规格选择：必须写进 d.specs[key][group]，[key] 是商品（行）标识。
   曾写成 d.specs[group]，与按钮读取和校验时的键不一致，导致选完永远校验不过。 */
 if(a==='w-spec'){
  const d=s.dialog;
  const key=b.dataset.product||(d.products&&d.products[0]&&(d.products[0].lineId||d.products[0].id))||null;
  d.specs={...d.specs,[key]:{...(d.specs[key]||{}),[b.dataset.group]:b.dataset.value}};
  render();return;}
 if(a==='w-spec-confirm'){confirmSpecs();return;}
 if(a==='w-del-taste'){const r=memory.deleteTaste(b.dataset.id);notify(r.persisted?'已删除这一条':'删除失败，条目仍在');render();return;}
 if(a==='w-clear-mem'){memory.clearAll();notify('已清除全部已保存内容');render();return;}
});

function handleDecide(i){
 const step=i+1;
 if(i===0)decideCurrent(0,1,'按常规食量先算');
 else if(i===1)decideCurrent(1,{mode:'none',minor:null},'先不设上限');
 else if(i===2)decideCurrent(2,{...W.emptyExternal(),confirmed:true},'都还没有');
 else if(i===3)decideCurrent(3,{words:[]},'都可以，你来挑');
 else if(i===4)decideCurrent(4,null,'先不限定');
 else if(i===5)decideCurrent(5,{mode:'balance',familiar:[]},'帮我拿捏');
 else if(i===6)decideCurrent(6,{length:1},'先只搭本顿');
 else return;
 /* 只前进一题，绝不跳过剩余题目 */
 s.wizard.step=Math.min(8,step+1);
 syncFromAnswers();render();
}

function submitWizard(){
 /* 用户直接点“看看我的搭配”而没动任何同意开关时，
    第 8 题算作明确回答“这次就好”，而不是未答；同时不新增任何长期保存。 */
 if(!W.isAnswered(s.wizard.answers[7]))
  s.wizard.answers[7]={status:'answered',value:{consent:W.emptyConsent()},source:'unlimited',at:new Date().toISOString()};
 if(!gate()){notify('还有题目没答完');return;}
 const mem=answerValue(7)||{consent:W.emptyConsent()};
 const consent=mem.consent||W.emptyConsent();
 const result=W.persistResult(()=>memory.setConsent(consent));
 const tasteAns=answerValue(3);
 const saves=[];
 if(consent.saveExplicitTaste&&tasteAns&&tasteAns.words.length){
  const t=W.buildTaste(tasteAns.words,'explicit');
  const entries=[];
  if(t.texture.length)entries.push({subjectId:'self',dimension:'texture',value:t.texture[0]});
  if(t.spice.length)entries.push({subjectId:'self',dimension:'spice',value:t.spice[0]});
  if(t.richness.length)entries.push({subjectId:'self',dimension:'richness',value:t.richness[0]});
  const r=W.persistResult(()=>memory.saveExplicitTaste(entries,'consent-'+Date.now()));
  saves.push(r);
 }
 s.wizard={...s.wizard,completed:true,step:8};
 recompute();
 /* 保存最终选餐记录必须发生在实际选定方案之后 */
 let chosenNotice=null;
 if(consent.saveFinalSelection&&s.rec&&s.rec.suggestedParts&&s.rec.suggestedParts.length){
  const r=W.persistResult(()=>memory.saveFinalSelection({items:s.rec.suggestedParts,totalMinor:s.rec.total?s.rec.total.minor:null},'consent-'+Date.now()));
  chosenNotice=r;
 }
 if(consent.saveRotationPlan&&s.plan){
  W.persistResult(()=>memory.saveRotation(s.plan,'consent-'+Date.now()));
 }
 go('result');
 if(!result.ok)notify(result.message);
 else if(chosenNotice&&!chosenNotice.ok)notify(chosenNotice.message);
 else if(saves.some(x=>!x.ok))notify('这次已用上，部分内容没能保存到下次。');
}

/* 推荐加入餐单：完整建议列表作为待提交快照，弹层只负责收集"需要规格"的子集。
   确认后一次性提交**完整快照**，而不是只提交弹层里的那几项。
   旧实现把建议先过滤成 needSpecs 再提交，导致无规格的主食/小食全被丢掉。 */
function addSuggestions(){
 if(!s.rec||!s.rec.suggestedParts||!s.rec.suggestedParts.length)return;
 const all=JSON.parse(JSON.stringify(s.rec.suggestedParts));
 const needSpecs=all.filter(p=>p.specGroups&&p.specGroups.length);
 if(!needSpecs.length){
  /* 全都无需规格：直接原子提交完整列表，不弹层、不空提交 */
  commitAdd(all,{});
  return;
 }
 const specs={};
 for(const p of needSpecs)specs[p.lineId||p.id]={...(p.specs||{})};
 s.dialog={type:'specs',products:needSpecs,specs,pending:all,id:'add-'+Date.now(),fromSuggestion:true};
 render();
}
/* 一次事务提交。products 是完整列表，specs 按商品键存放已确认的规格。 */
function commitAdd(products,specs){
 const id=(s.dialog&&s.dialog.id)||'add-'+Date.now();
 if(!products||!products.length)return;
 s.state=D.reduce(s.state,{type:'ADD',products,specs:specs||{},id});
 const n=s.state.cart.reduce((a,l)=>a+l.quantity,0);
 notify('已加入 '+products.length+' 种，餐单共 '+n+' 件');
 s.dialog=null;
 recompute();
 go('cart');
}
/* 改规格：必须替换原行，不能 ADD 出一行新的。 */
function confirmSpecs(){
 const d=s.dialog;
 const bad=d.products.some(p=>!D.validateSpecs(p,d.specs[p.lineId||p.id]||{}).valid);
 if(bad)return;
 if(d.editKey){
  /* 逐行编辑：按原 key 替换，保留原数量与人员归属 */
  const p=d.products[0];
  const specKey=p.lineId||p.id;
  /* D.reduce 返回新状态，不是原地修改 */
  s.state=D.reduce(s.state,{type:'EDIT_LINE',key:d.editKey,product:p,specs:d.specs[specKey]||{},id:'edit-'+d.editKey});
  notify('已更新规格，数量不变');
  s.dialog=null;
  recompute();
  go('cart');
  return;
 }
 /* 推荐加入：提交完整快照 pending，规格用弹层确认过的 */
 commitAdd(d.pending||d.products,d.specs);
}
function addProduct(id){
 const p=C.products.find(x=>x.id===id);if(!p)return;
 const now=Date.now();
 if(s.lastAdded===id&&now-s.lastAddedAt<500)return;
 s.lastAdded=id;s.lastAddedAt=now;
 if(p.specGroups&&p.specGroups.length){
  const specs={};for(const g of p.specGroups)specs[p.id]={...(specs[p.id]||{})};
  s.dialog={type:'specs',products:[p],specs,id:'add-'+now};
  render();return;
 }
 s.state=D.reduce(s.state,{type:'ADD',products:[p],specs:{},id:'add-'+now});
 notify('已加入餐单');
 render();
}
function changeQty(key,q){
 s.state=D.reduce(s.state,{type:'QUANTITY',key,quantity:q});
 recompute();render();
}
/* 改规格：把原行的数量与人员归属一起带进弹层，确认后走 EDIT_LINE 替换原行 */
function editSpecs(key){
 const l=s.state.cart.find(x=>x.key===key);if(!l)return;
 const p=C.products.find(x=>x.id===l.productId);if(!p)return;
 s.dialog={type:'specs',products:[{...p,lineId:p.id,quantity:l.quantity,assignedTo:l.assignedTo||[]}],
  specs:{[p.id]:{...l.specs}},id:'edit-'+key,editKey:key};
 render();
}

function openSavings(){
 /* 未接入真实报价时如实说明，不用虚构价格冒充省钱成果 */
 s.savings={status:'pending',message:'省钱方案待接入：官方券资格与总价尚未在本页核验。不会自动领券、凑单或购卡。'};
 s.dialog={type:'savings'};render();
}
function recordFeedback(kind){
 const d=s.dialog;if(!d)return;
 const rec=W.feedbackRecord(W.feedbackGate('meal-current',s.eaten),d.unit,kind,s.eaten,
  (answerValue(7)?.consent||{}).saveExplicitTaste?'consent-'+Date.now():null);
 if(!rec){notify('还没确认这顿吃过，不记录体验');s.dialog=null;render();return;}
 const r=W.persistResult(()=>memory.saveFeedback(rec,rec.saveConsentId));
 s.dialog=null;s.feedbackOpen=false;render();
 notify(r.persisted?'已记录，会影响以后的推荐':'这次已用上，没能保存到下次');
}
function closeFeedback(kind){
 if(kind){
  const rec=W.feedbackRecord(W.feedbackGate('meal-current',s.eaten),'all',kind,s.eaten,null);
  if(rec){const r=W.persistResult(()=>memory.saveFeedback(rec,null));notify(r.persisted?'已记录':'这次已用上，没能保存到下次');}
 }
 s.feedbackOpen=false;render();
}

/* ---------- 弹层 ---------- */
function sheet(){
 const d=s.dialog;
 const ov=V.el('div','dialog-backdrop');
 const box=V.el('section','sheet',null,{role:'dialog','aria-modal':'true','aria-labelledby':'dlg-title'});
 box.append(V.el('div','handle'),V.add(V.el('div','sheet-header'),V.el('h2',null,d.type==='specs'?'确认规格':d.type==='savings'?'省钱方案':'刚才哪里不合适？',{id:'dlg-title'}),
  V.btn('×','close-dialog','icon-btn',{'aria-label':'关闭并取消'})));
 if(d.type==='specs'){
  box.append(V.el('p','muted','先确认每行必选规格。演示价下不同杯型同价。'));
  for(const p of d.products){
   if(!p.specGroups||!p.specGroups.length)continue;
   const key=p.lineId||p.id;
   box.append(V.el('h3','spec-product',p.name+' ×'+(p.quantity||1)));
   for(const g of p.specGroups){
    const row=V.el('div','tools-row');
    for(const o of g.options)
     row.append(V.btn(o.label,'w-spec','chip'+(((d.specs[key]||{})[g.id]===o.id)?' selected':''),{group:g.id,value:o.id,product:key},{'aria-pressed':String((d.specs[key]||{})[g.id]===o.id)}));
    box.append(row);
   }
  }
  const c=V.btn(d.editKey?'确认规格修改':'确认并加入餐单','w-spec-confirm','cta');
  c.disabled=d.products.some(p=>!D.validateSpecs(p,d.specs[p.lineId||p.id]||{}).valid);
  box.append(c);
 }
 if(d.type==='savings'){
  box.append(V.el('div','notice'),V.el('strong',null,s.savings.message));
  box.append(V.el('p','fine-note','只有在获准的真实连接核验过券资格与完整应付成本后，才会比较方案并显示节省额。任何必要费用未知都只标待核实。'));
 }
 if(d.type==='fb-item'){
  for(const p of (s.rec&&s.rec.suggestedParts)||[])
   box.append(V.btn(p.name,'w-fb-item','drawer-choice',{id:p.id}));
 }
 if(d.type==='fb-kind'){
  for(const [k,label] of [['too-spicy','太辣'],['too-rich','太腻'],['texture','口感不对'],['portion','份量不合适']])
   box.append(V.btn(label,'w-fb-kind','drawer-choice',{kind:k}));
 }
 box.append(V.btn('取消','close-dialog','secondary-action'));
 ov.append(box);return ov;
}

document.addEventListener('keydown',e=>{
 if(!s.dialog)return;
 if(e.key==='Escape'){e.preventDefault();s.dialog=null;render();}
 if(e.key==='Tab'){
  const nodes=[...document.querySelectorAll('[role=dialog] button:not(:disabled)')];
  const first=nodes[0],last=nodes.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
 }
});

/* 饭后反馈：只有主动确认吃过才出现 */
const origRender=render;
window.McApp={getState:()=>JSON.parse(JSON.stringify({step:s.wizard.step,answered:W.answeredCount(s.wizard),completed:s.wizard.completed,route:s.route,people:s.state.constraints.people,cart:s.state.cart.length})),
 feedbackOpen:()=>s.feedbackOpen};
render();
})();
